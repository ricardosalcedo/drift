[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-llm"
version = "0.4.0"
description = "Track LLM quality over time with golden prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Ricardo Salcedo"}]
keywords = ["llm", "quality", "monitoring", "drift", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
bedrock = ["boto3>=1.28.0"]
all = ["boto3>=1.28.0"]

[project.urls]
Homepage = "https://github.com/ricardosalcedo/drift"
Repository = "https://github.com/ricardosalcedo/drift"
Issues = "https://github.com/ricardosalcedo/drift/issues"

[project.scripts]
drift = "drift:main"

[tool.setuptools]
py-modules = ["drift"]
